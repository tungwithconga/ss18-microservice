# ─── identity-service.yml ───────────────────────────────────────────────────
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rikkeibank_identity?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: rikkeibank-super-secret-key-for-jwt-signing-minimum-256-bits!!
  access-token-expiry: 900000       # 15 phút (ms)
  refresh-token-expiry: 604800000   # 7 ngày (ms)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
