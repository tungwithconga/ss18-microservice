server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "configserver:http://localhost:8888"

  cloud:
    gateway:
      routes:
        # ── identity-service ──────────────────────────────────────────────────
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**

        # ── customer-service ──────────────────────────────────────────────────
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**, /api/staffs/**

        # ── account-service ───────────────────────────────────────────────────
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**, /api/account-types/**

        # ── transaction-service ───────────────────────────────────────────────
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**

        # ── notification-service ──────────────────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: rikkeibank-super-secret-key-for-jwt-signing-minimum-256-bits!!

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
